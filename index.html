<style>

.suggestions{position:absolute;z-index:40;top:calc(100% + 7px);left:0;right:0;display:none;max-height:330px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 22px 48px rgba(34,49,78,.16);padding:5px}.suggestions.open{display:block}.option{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px;border-radius:11px;cursor:pointer}.option:hover,.option.active{background:#f5f7fc}.option-main{min-width:0}.option b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option-tag{flex:none;border-radius:999px;background:#eef1ff;color:#5569c9;padding:4px 7px;font-size:9.5px;font-weight:850}.empty-option{padding:16px;color:#8b96a8;font-size:12px;text-align:center}
.export-wrap{position:relative}.export-btn{height:42px;border:0;border-radius:13px;background:linear-gradient(145deg,#596ff4,#755fea);color:#fff;padding:0 15px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 8px 20px rgba(89,111,244,.19)}.export-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.export-btn svg{width:15px;height:15px}.export-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:35;width:232px;padding:5px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 20px 44px rgba(34,49,78,.15);display:none}.export-menu.open{display:block}.menu-item{width:100%;display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;padding:10px;border-radius:10px;text-align:left;color:#344057;cursor:pointer}.menu-item:hover{background:#f5f7fb}.menu-icon{width:30px;height:30px;border-radius:9px;background:#f0f3ff;color:#586ee7;display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}.menu-item b{display:block;font-size:12px}.menu-item small{display:block;color:#8390a2;font-size:10px;line-height:1.35;margin-top:2px}
.action-line{height:18px;display:flex;justify-content:flex-end;align-items:center;margin:-3px 3px 6px;color:#78859a;font-size:10.5px;opacity:0;transition:.2s}.action-line.show{opacity:1}
.view-head{display:none;align-items:flex-end;justify-content:space-between;gap:14px;margin:3px 2px 10px}.view-head.show{display:flex}.view-title h2{margin:0;font-size:21px;letter-spacing:-.035em}.view-title p{margin:4px 0 0;color:var(--muted);font-size:11.5px}.mode-badge{display:inline-flex;align-items:center;border-radius:999px;background:#eef2ff;color:#5569c9;padding:6px 9px;font-size:10px;font-weight:850;white-space:nowrap}
.stats{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stats.show{display:grid}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-sm)}.stat-label{font-size:10px;font-weight:850;letter-spacing:.055em;text-transform:uppercase;color:#7c8799}.stat-value{margin-top:5px;font-size:23px;line-height:1;font-weight:880;letter-spacing:-.04em}.stat-note{margin-top:5px;color:#8b96a8;font-size:10px;min-height:13px}
.section-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 2px 8px}.section-bar h3{margin:0;font-size:13px}.section-bar p{margin:3px 0 0;color:#8994a6;font-size:10.5px}.section-right{color:#8b96a8;font-size:10px;white-space:nowrap}
.schedule-shell{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}.schedule-grid{display:grid;grid-template-columns:76px repeat(5,minmax(176px,1fr));min-width:1040px}.ghead,.period,.slot{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.schedule-grid>*:nth-child(6n){border-right:0}.schedule-grid>*:nth-last-child(-n+6){border-bottom:0}.ghead{position:sticky;top:0;z-index:5;padding:12px 10px;text-align:center;background:rgba(249,250,253,.97);backdrop-filter:blur(8px);font-size:11.5px;font-weight:850;color:#536078}.ghead.corner{left:0;z-index:7}.period{position:sticky;left:0;z-index:4;display:grid;place-items:center;background:#fbfcfe;padding:12px 7px;font-size:11px;font-weight:850;color:#56647b}.slot{min-height:118px;padding:7px;background:#fff}.slot.blank{background:linear-gradient(145deg,#fff,#fdfdfe)}.empty{height:100%;min-height:102px}
.lesson{min-height:102px;border:1px solid var(--tone-border);background:linear-gradient(145deg,var(--tone-a),var(--tone-b));border-radius:13px;padding:10px 10px 9px;position:relative;overflow:hidden}.lesson+.lesson{margin-top:6px}.lesson:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tone-accent)}.lesson[data-tone="0"]{--tone-a:#f6f8ff;--tone-b:#eff3ff;--tone-border:#dfe6ff;--tone-accent:#6078f2}.lesson[data-tone="1"]{--tone-a:#f4fbf8;--tone-b:#edf8f4;--tone-border:#d9eee6;--tone-accent:#2aa481}.lesson[data-tone="2"]{--tone-a:#fff9f0;--tone-b:#fff5e7;--tone-border:#f5e5cb;--tone-accent:#d99738}.lesson[data-tone="3"]{--tone-a:#faf6ff;--tone-b:#f5efff;--tone-border:#e7dcfa;--tone-accent:#8d69dc}.lesson[data-tone="4"]{--tone-a:#fff6f8;--tone-b:#fdf0f3;--tone-border:#f1dde3;--tone-accent:#d97791}.lesson[data-tone="5"]{--tone-a:#f4faff;--tone-b:#edf7ff;--tone-border:#d8eafa;--tone-accent:#4d97cc}.subject{font-size:12.5px;font-weight:880;line-height:1.3}.classcode{display:inline-flex;margin:6px 0 5px;border-radius:999px;padding:3px 7px;background:rgba(255,255,255,.72);border:1px solid rgba(86,106,145,.10);font-size:9.5px;font-weight:850;color:#465571}.meta{display:grid;gap:2px;color:#68758a;font-size:10px;line-height:1.35}.meta-row{display:flex;gap:5px;min-width:0}.meta-row span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count-badge{margin-top:6px;display:inline-flex;border-radius:999px;background:rgba(255,255,255,.68);padding:3px 6px;color:#6f7b8e;font-size:9px;font-weight:800}
.roster{display:none;margin-top:12px}.roster.show{display:block}.roster-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}.roster-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}.roster-head h3{margin:0;font-size:13px}.roster-head span{font-size:10.5px;color:#7e899b}.table-wrap{overflow:auto}.roster table{width:100%;border-collapse:collapse;min-width:620px}.roster th,.roster td{padding:9px 13px;border-bottom:1px solid #eef1f5;text-align:left;font-size:11.5px}.roster th{background:#fafbfc;color:#6f7b8f;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}.roster tr:last-child td{border-bottom:0}.roster td:nth-child(1),.roster th:nth-child(1){width:58px;text-align:center}.roster td:nth-child(2),.roster th:nth-child(2){width:105px}.roster td:nth-child(4),.roster th:nth-child(4){width:90px}
.footer{display:flex;justify-content:space-between;gap:12px;margin:13px 3px 0;color:#9aa4b3;font-size:9.5px}
@media(max-width:900px){.app{padding:14px}.control{grid-template-columns:1fr auto}.segmented{grid-column:1/-1;width:100%}.seg{flex:1}.search-wrap{min-width:0}.stats{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.brand p{display:none}.live-chip{max-width:58vw;overflow:hidden;text-overflow:ellipsis}.view-head{align-items:flex-start}.section-right{display:none}}
@media(max-width:560px){.app{padding:11px}.logo{width:40px;height:40px;border-radius:13px}.brand h1{font-size:17px}.live-wrap{gap:5px}.live-chip{padding:7px 9px;font-size:10px;max-width:51vw}.control{padding:9px;border-radius:16px;gap:8px}.seg{padding:8px 7px;font-size:10.5px}.export-btn{padding:0 11px}.export-btn .export-label{display:none}.stats{gap:7px}.stat{padding:11px 12px}.stat-value{font-size:20px}.view-title h2{font-size:18px}.mode-badge{display:none}.schedule-shell{border-radius:15px}.footer{display:none}}
@media print{body{background:#fff}.topbar,.control,.action-line,.section-bar,.footer{display:none!important}.app{padding:0}.schedule-shell{box-shadow:none;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">TKB</div><div><h1>Thời khóa biểu lớp 10</h1><p>Tra cứu theo học sinh, giáo viên và mã lớp</p></div></div>
    <div class="live-wrap">
      <div class="live-chip wait" id="liveChip"><span class="live-dot"></span><span id="liveText">Đang cập nhật dữ liệu…</span></div>
      <button class="icon-btn" id="syncBtn" title="Cập nhật ngay" aria-label="Cập nhật ngay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </header>

  <section class="control">
    <div class="segmented" role="tablist" aria-label="Chế độ xem">
      <button class="seg active" data-mode="student">Học sinh</button>
      <button class="seg" data-mode="teacher">Giáo viên</button>
      <button class="seg" data-mode="class">Mã lớp</button>
    </div>
    <div class="search-wrap">
      <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" autocomplete="off" placeholder="Tìm tên hoặc mã học sinh…" aria-label="Tìm kiếm"></div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="export-wrap">
      <button class="export-btn" id="exportBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="export-label">Xuất file</span></button>
      <div class="export-menu" id="exportMenu">
        <button class="menu-item" id="excelBtn"><span class="menu-icon">XLS</span><span><b>Excel tổng hợp</b><small>Grid, chi tiết và danh sách học sinh</small></span></button>
        <button class="menu-item" id="pdfBtn"><span class="menu-icon">PDF</span><span><b>PDF A4 dọc</b><small>Tên file tự điền khi lưu</small></span></button>
        <button class="menu-item" id="pngBtn"><span class="menu-icon">PNG</span><span><b>Ảnh điện thoại</b><small>1080 × 2400 dùng làm hình nền</small></span></button>
      </div>
    </div>
  </section>
  <div class="action-line" id="actionLine"></div>

  <section class="view-head" id="viewHead">
    <div class="view-title"><h2 id="viewTitle"></h2><p id="viewSub"></p></div>
    <span class="mode-badge" id="modeBadge"></span>
  </section>
  <section class="stats" id="stats"></section>

  <div class="section-bar"><div><h3>Thời khóa biểu</h3><p>Hàng là tiết · cột là thứ · mỗi ô hiển thị đầy đủ thông tin lớp</p></div><div class="section-right" id="gridNote"></div></div>
  <section class="schedule-shell"><div class="schedule-grid" id="scheduleGrid"></div></section>

  <section class="roster" id="roster"><div class="roster-card"><div class="roster-head"><h3 id="rosterTitle">Danh sách học sinh</h3><span id="rosterMeta"></span></div><div class="table-wrap"><table><thead><tr><th>STT</th><th>Mã HS</th><th>Họ và tên</th><th>Lớp gốc</th></tr></thead><tbody id="rosterBody"></tbody></table></div></div></section>
  <footer class="footer"><span>Thời khóa biểu lớp 10</span><span id="footerTime"></span></footer>
</div>
<script>
const DAYS=[2,3,4,5,6],PERIODS=[1,2,3,4];
const DIRECT_SHEET_ID='19OOBVAKV0J47hh-MuJIyHGlgfjcrJ5gHWR_nrPSsgtg';
const DIRECT_SHEET_GID='0';
const LIVE_POLL_MS=15000;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={mode:'student',data:null,selection:null,source:'loading',lastSync:null,version:null,activeOption:-1};
const els={search:$('#search'),suggestions:$('#suggestions'),grid:$('#scheduleGrid'),viewHead:$('#viewHead'),viewTitle:$('#viewTitle'),viewSub:$('#viewSub'),modeBadge:$('#modeBadge'),stats:$('#stats'),roster:$('#roster'),rosterTitle:$('#rosterTitle'),rosterMeta:$('#rosterMeta'),rosterBody:$('#rosterBody'),exportBtn:$('#exportBtn'),exportMenu:$('#exportMenu'),liveChip:$('#liveChip'),liveText:$('#liveText'),syncBtn:$('#syncBtn'),actionLine:$('#actionLine'),gridNote:$('#gridNote'),footerTime:$('#footerTime')};
function clean(v){return v==null?'':String(v).trim()}function norm(v){return clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function esc(v){return clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function key(d,p){return d+'-'+p}function uniq(a){return [...new Set(a.filter(Boolean))]}function fmt(dt){if(!dt)return'';return new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hour12:false}).format(dt).replace(',',' ·')}function tone(s){let h=0;for(const c of clean(s))h=(h*31+c.charCodeAt(0))>>>0;return h%6}
let actionTimer;function action(msg){clearTimeout(actionTimer);els.actionLine.textContent=msg;els.actionLine.classList.add('show');actionTimer=setTimeout(()=>els.actionLine.classList.remove('show'),2600)}
function blankMatrix(){const m={};for(const d of DAYS)for(const p of PERIODS)m[key(d,p)]=[];return m}
function parseRows(rows){
  if(!rows||rows.length<2)throw new Error('Dữ liệu chưa sẵn sàng');
  const header=rows[0].map(clean),ix=Object.fromEntries(header.map((h,i)=>[h,i]));
  const students=[],teachers=new Set(),codes=new Set(),subjects=new Set();
  for(const r0 of rows.slice(1)){
    const r=Array.from({length:header.length},(_,i)=>r0?.[i]??'');const id=clean(r[ix['Student_ID']]),name=clean(r[ix['Họ và tên']]);if(!id&&!name)continue;
    const s={id,name,homeClass:clean(r[ix['Lớp gốc']]),schedule:[]};
    for(const d of DAYS)for(const p of PERIODS){const pre=`Sáng T${d} - Tiết ${p} - `,subject=clean(r[ix[pre+'Môn học']]),code=clean(r[ix[pre+'Mã lớp']]),teacher=clean(r[ix[pre+'Giáo viên']]),room=clean(r[ix[pre+'Phòng']]);if(subject||code||teacher||room){s.schedule.push({day:d,period:p,subject,code,teacher,room});if(teacher)teachers.add(teacher);if(code)codes.add(code);if(subject)subjects.add(subject)}}
    students.push(s)
  }
  const byId=new Map(students.map(s=>[s.id,s])),teacherSlots=new Map(),classSlots=new Map(),classStudents=new Map();
  for(const s of students)for(const l of s.schedule){
    if(l.teacher){if(!teacherSlots.has(l.teacher))teacherSlots.set(l.teacher,new Map());const sm=teacherSlots.get(l.teacher),k=key(l.day,l.period);if(!sm.has(k))sm.set(k,new Map());const gk=[l.subject,l.code,l.room].join('|');if(!sm.get(k).has(gk))sm.get(k).set(gk,{...l,studentIds:new Set()});sm.get(k).get(gk).studentIds.add(s.id)}
    if(l.code){if(!classSlots.has(l.code))classSlots.set(l.code,new Map());const sm=classSlots.get(l.code),k=key(l.day,l.period),gk=[l.subject,l.teacher,l.room].join('|');if(!sm.has(k))sm.set(k,new Map());if(!sm.get(k).has(gk))sm.get(k).set(gk,{...l,studentIds:new Set()});sm.get(k).get(gk).studentIds.add(s.id);if(!classStudents.has(l.code))classStudents.set(l.code,new Set());classStudents.get(l.code).add(s.id)}
  }
  return{students,teachers:[...teachers].sort((a,b)=>a.localeCompare(b,'vi')),codes:[...codes].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true})),subjects:[...subjects],byId,teacherSlots,classSlots,classStudents}
}
function applyRows(rows,updatedAt,version){state.data=parseRows(rows);state.source='live';state.lastSync=updatedAt?new Date(updatedAt):new Date();state.version=version??state.version;els.search.disabled=false;updateLive();if(state.selection&&!selectionExists(state.selection))clearSelection();else if(state.selection)renderView();renderSuggestionsIfOpen()}
function selectionExists(sel){if(!state.data)return false;if(state.mode==='student')return state.data.byId.has(sel);if(state.mode==='teacher')return state.data.teacherSlots.has(sel);return state.data.classSlots.has(sel)}
function updateLive(syncing=false){
  els.liveChip.classList.remove('wait','warn');
  if(syncing){els.liveChip.classList.add('wait');els.liveText.textContent='Đang cập nhật dữ liệu trực tiếp…';els.syncBtn.classList.add('spin');els.syncBtn.disabled=true;return}
  els.syncBtn.classList.remove('spin');els.syncBtn.disabled=false;
  if(state.source==='live'&&state.lastSync){
    els.liveText.textContent=`Dữ liệu trực tiếp · ${fmt(state.lastSync)}`;
    els.footerTime.textContent=`Cập nhật ${fmt(state.lastSync)}`;
  }else{
    els.liveChip.classList.add('warn');
    els.liveText.textContent='Chưa kết nối dữ liệu trực tiếp';
    els.footerTime.textContent='';
