<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thời khóa biểu tự chọn lớp 10</title>
  <meta name="description" content="Tra cứu lịch học môn tự chọn khối 10">
  <style>
    :root{--navy:#081a30;--blue:#2675ed;--paper:#fffefa;--cream:#f5f3eb;--ink:#132942;--muted:#728197}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}
    header{min-height:520px;padding:26px;background:radial-gradient(circle at 80% 25%,#214d7a 0,transparent 30%),linear-gradient(130deg,#061426,#102d51);color:white;position:relative;overflow:hidden}
    nav,.hero,.results,footer{max-width:1100px;margin:auto}nav{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.08em}.logo{display:grid;place-items:center;width:42px;height:42px;border:1px solid #7c8da3;border-radius:13px}.status{font-size:12px;color:#c8d4e3}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#63d9a1;margin-right:8px}
    .hero{text-align:center;padding:75px 0}.tag{color:#9fc1ec;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(40px,7vw,70px);line-height:1.04;letter-spacing:-.05em;margin:16px 0}.hero h1 em{font-style:normal;color:#83b8ff;font-weight:500}.hero p{color:#b8c6d6}
    .tabs{display:flex;justify-content:center;gap:4px;margin:28px auto 12px}.tabs button{border:1px solid #40556f;background:#0b213b;color:#a9bad0;border-radius:10px;padding:9px 15px;cursor:pointer}.tabs button.active{background:white;color:#173b6a}
    .search{max-width:740px;margin:auto;display:flex;gap:8px;padding:8px;background:white;border-radius:17px;box-shadow:0 18px 55px #0006;position:relative}.search input{flex:1;min-width:0;border:0;outline:0;padding:0 15px}.search>button{border:0;background:var(--blue);color:white;border-radius:12px;padding:15px 22px;font-weight:700;cursor:pointer}
    #suggestions{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 8px);padding:7px;background:white;color:var(--ink);border-radius:14px;box-shadow:0 20px 50px #0005;text-align:left;max-height:340px;overflow:auto}#suggestions[hidden],#results[hidden]{display:none}.option{width:100%;border:0;background:white;text-align:left;padding:11px 13px;border-radius:9px;cursor:pointer}.option:hover{background:#edf4ff}.option strong,.option small{display:block}.option small{color:var(--muted)}
    #message{font-size:12px;color:#ffb5b5;min-height:20px}.results{padding:70px 26px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.heading h2{font-size:36px;line-height:1.1;margin:0}.heading p{color:var(--muted);margin:7px 0 0}.reset{border:1px solid #cbd3dc;background:white;border-radius:10px;padding:10px 14px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;background:var(--paper);border:1px solid #dfe5ea;border-left:4px solid var(--tone,#2675ed);border-radius:14px;padding:26px}.card h3{font-size:24px;line-height:1.2;margin:18px 0 6px}.card .teacher{color:var(--muted)}.code{display:inline-block;background:#e8f0fb;color:#3a72c6;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800}.details{border-top:1px solid #e3e7eb;margin-top:20px;padding-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.details small{display:block;color:#8b97a7;text-transform:uppercase;font-size:9px}.details strong{font-size:12px}footer{border-top:1px solid #dad7ce;padding:25px 26px;color:#7f878d;font-size:11px}
    @media(max-width:680px){header{padding:20px;min-height:580px}.hero{padding:55px 0}.tabs{justify-content:flex-start;overflow:auto}.tabs button{white-space:nowrap}.search>button{padding:13px;font-size:0}.search>button:after{content:"→";font-size:20px}.cards{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <header><nav><div class="brand"><span class="logo">10</span>TKB TỰ CHỌN</div><span class="status" id="status">Đang tải dữ liệu…</span></nav><div class="hero"><span class="tag">Năm học 2026–2027</span><h1>Tra cứu lịch học<br><em>nhanh &amp; chính xác.</em></h1><p>Bản HTML tĩnh dành cho GitHub Pages, đọc dữ liệu trực tiếp từ Google Sheet.</p><div class="tabs"><button class="active" data-mode="student">Học sinh</button><button data-mode="class">Mã lớp</button><button data-mode="room">Phòng học</button><button data-mode="teacher">Giáo viên</button></div><form class="search" id="form"><input id="query" placeholder="Nhập họ và tên học sinh" disabled autocomplete="off"><button>Tra cứu</button><div id="suggestions" hidden></div></form><div id="message"></div></div></header>
  <section class="results" id="results" hidden><div class="heading"><div><h2 id="title"></h2><p id="subtitle"></p></div><button class="reset" id="reset">Tra cứu nội dung khác</button></div><div class="cards" id="cards"></div></section>
  <footer>THỜI KHÓA BIỂU TỰ CHỌN · KHỐI 10 · Dữ liệu trực tiếp từ Google Sheet</footer>
  <script>
    const URL='https://docs.google.com/spreadsheets/d/1QUEQ-cXqM1jviCXYZg9xgaBs0w87YW7AJfKBkfjik58/export?format=csv&gid=0';let students=[],mode='student',found=[];
    const $=s=>document.querySelector(s),norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().trim();
    function parse(text){let a=[],r=[],c='',q=false;for(let i=0;i<text.length;i++){let x=text[i];if(x==='"'){if(q&&text[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c.trim());c=''}else if(/[\r\n]/.test(x)&&!q){if(x==='\r'&&text[i+1]==='\n')i++;r.push(c.trim());c='';if(r.some(Boolean))a.push(r);r=[]}else c+=x}let h=a.shift()||[];return a.map(v=>Object.fromEntries(h.map((k,i)=>[k.trim(),(v[i]||'').trim()]))) }
    function sub(r,n){return r['Môn '+n]?{slot:n,name:r['Môn '+n],code:r['Mã chính thức Môn '+n]||r['Mã lớp Môn '+n],classCode:r['Mã lớp Môn '+n],teacher:r['Giáo viên Môn '+n],day:r['Thứ Môn '+n],shift:r['Ca Môn '+n],room:r['Phòng Môn '+n]}:null}
    function sessions(){let m=new Map;students.forEach(st=>st.subjects.forEach(s=>{let k=s.code+'|'+s.day+'|'+s.shift;if(m.has(k))m.get(k).students.push(st);else m.set(k,{...s,key:k,students:[st]})}));return [...m.values()]}
    function options(){if(mode==='student')return students.map(x=>({label:x.name,sub:'Lớp '+x.homeroom,search:x.name+' '+x.homeroom,data:x}));let ss=sessions();if(mode==='class')return ss.map(x=>({label:x.code,sub:x.name+' · '+x.classCode,search:x.code+' '+x.classCode+' '+x.name,data:x}));let f=mode==='room'?'room':'teacher',g=new Map;ss.forEach(x=>g.set(x[f],[...(g.get(x[f])||[]),x]));return [...g].map(([k,v])=>({label:k,sub:v.length+' lớp',search:k,data:v}))}
    function card(s){return `<article class="card"><span class="code">${s.code}</span><h3>${s.name}</h3><p class="teacher">${s.teacher}</p><div class="details"><div><small>Thời gian</small><strong>${s.day} · ${s.shift}</strong></div><div><small>Phòng học</small><strong>${s.room||'Đang cập nhật'}</strong></div><div><small>Mã lớp</small><strong>${s.classCode}</strong></div></div></article>`}
    function choose(o){let list,title,subtitle;if(mode==='student'){list=o.data.subjects;title=o.data.name;subtitle='Lớp '+o.data.homeroom}else if(mode==='class'){list=[o.data];title=o.label;subtitle=o.data.students.length+' học sinh'}else{list=o.data;title=o.label;subtitle=mode==='room'?'Lịch sử dụng phòng học':'Lịch giảng dạy'}$('#title').textContent=title;$('#subtitle').textContent=subtitle;$('#cards').innerHTML=list.map(card).join('');$('#results').hidden=false;$('#suggestions').hidden=true;$('#results').scrollIntoView()}
    function search(){let n=norm($('#query').value);found=n.length<2?[]:options().filter(x=>norm(x.search).includes(n)).slice(0,10);$('#suggestions').innerHTML=found.length?found.map((x,i)=>`<button type="button" class="option" data-i="${i}"><strong>${x.label}</strong><small>${x.sub}</small></button>`).join(''):'<div class="option">Không tìm thấy kết quả</div>';$('#suggestions').hidden=n.length<2;document.querySelectorAll('.option[data-i]').forEach(b=>b.onclick=()=>choose(found[+b.dataset.i]))}
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('#query').value='';$('#query').placeholder={student:'Nhập họ và tên học sinh',class:'Nhập mã lớp',room:'Nhập phòng học',teacher:'Nhập tên giáo viên'}[mode];$('#results').hidden=true});$('#query').oninput=search;$('#query').onfocus=search;$('#form').onsubmit=e=>{e.preventDefault();if(found[0])choose(found[0])};$('#reset').onclick=()=>{scrollTo({top:0,behavior:'smooth'});$('#results').hidden=true;$('#query').value=''};
    fetch(URL+'&fresh='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(t=>{students=parse(t).filter(r=>r['Họ và tên']).map((r,i)=>({id:r.STT||i+1,name:r['Họ và tên'],homeroom:r['Lớp'],subjects:[sub(r,3),sub(r,4)].filter(Boolean)}));$('#query').disabled=false;$('#status').textContent='Cập nhật trực tiếp'}).catch(()=>{$('#status').textContent='Không tải được dữ liệu';$('#message').textContent='Hãy kiểm tra kết nối Internet và quyền công khai của Google Sheet.'});
  </script>
</body></html>
