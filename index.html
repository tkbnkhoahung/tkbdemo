<!doctype html>
<html lang="vi">
<head>

<title>Thời khóa biểu lớp 10</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f8fc;--card:#fff;--text:#19243a;--muted:#718096;--line:#e7ebf3;
  --brand:#596ff4;--brand-soft:#eef1ff;--green:#138a6c;--green-soft:#eaf8f3;
  --amber:#a96c12;--amber-soft:#fff5e6;--red:#b84b55;--red-soft:#fff0f2;
  --shadow:0 16px 42px rgba(38,52,82,.08);--shadow-sm:0 7px 20px rgba(38,52,82,.055);
  --radius:20px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:
radial-gradient(circle at 12% -8%,rgba(89,111,244,.10),transparent 28%),
radial-gradient(circle at 88% -8%,rgba(121,90,240,.07),transparent 25%),var(--bg);
color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}.app{width:min(1460px,100%);margin:0 auto;padding:20px 22px 34px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#5e75f6,#7b63ee);box-shadow:0 10px 25px rgba(89,111,244,.24);color:#fff;font-weight:900;font-size:13px;letter-spacing:.04em}.brand h1{margin:0;font-size:19px;letter-spacing:-.035em}.brand p{margin:4px 0 0;color:var(--muted);font-size:11.5px}
.live-wrap{display:flex;align-items:center;gap:8px}.live-chip{display:flex;align-items:center;gap:8px;min-height:36px;padding:8px 11px;border:1px solid #dbeee7;background:rgba(238,250,246,.9);border-radius:12px;color:#26735f;font-size:11.5px;font-weight:750;white-space:nowrap}.live-dot{width:7px;height:7px;border-radius:50%;background:#17a67e;box-shadow:0 0 0 4px rgba(23,166,126,.1)}.live-chip.wait{border-color:#e3e7f4;background:#f6f7fb;color:#758097}.live-chip.wait .live-dot{background:#9aa5b6;box-shadow:none}.live-chip.warn{border-color:#f1dfbf;background:#fff9ef;color:#9a681d}.live-chip.warn .live-dot{background:#d3922e;box-shadow:none}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#516079;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(34,49,78,.04);transition:.18s}.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}.icon-btn:disabled{opacity:.55;cursor:default;transform:none}.icon-btn svg{width:16px;height:16px}.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.control{display:grid;grid-template-columns:auto minmax(280px,1fr) auto;gap:12px;align-items:center;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.95);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px;backdrop-filter:blur(14px)}
.segmented{display:flex;gap:4px;background:#f2f4f8;border:1px solid #e9edf4;border-radius:13px;padding:4px}.seg{border:0;background:transparent;color:#6c7890;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.seg.active{background:#fff;color:#25334f;box-shadow:0 3px 11px rgba(38,52,82,.08)}
.search-wrap{position:relative}.searchbox{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px;border:1px solid #dfe5ef;background:#fff;border-radius:13px;transition:.16s}.searchbox:focus-within{border-color:#a9b6fb;box-shadow:0 0 0 4px rgba(89,111,244,.09)}.searchbox svg{width:17px;height:17px;color:#8b96a8;flex:none}.searchbox input{min-width:0;width:100%;border:0;outline:0;color:var(--text);background:transparent;font-size:13.5px}.searchbox input::placeholder{color:#a2acba}
.suggestions{position:absolute;z-index:40;top:calc(100% + 7px);left:0;right:0;display:none;max-height:330px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 22px 48px rgba(34,49,78,.16);padding:5px}.suggestions.open{display:block}.option{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px;border-radius:11px;cursor:pointer}.option:hover,.option.active{background:#f5f7fc}.option-main{min-width:0}.option b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option-tag{flex:none;border-radius:999px;background:#eef1ff;color:#5569c9;padding:4px 7px;font-size:9.5px;font-weight:850}.empty-option{padding:16px;color:#8b96a8;font-size:12px;text-align:center}
.export-wrap{position:relative}.export-btn{height:42px;border:0;border-radius:13px;background:linear-gradient(145deg,#596ff4,#755fea);color:#fff;padding:0 15px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 8px 20px rgba(89,111,244,.19)}.export-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.export-btn svg{width:15px;height:15px}.export-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:35;width:232px;padding:5px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 20px 44px rgba(34,49,78,.15);display:none}.export-menu.open{display:block}.menu-item{width:100%;display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;padding:10px;border-radius:10px;text-align:left;color:#344057;cursor:pointer}.menu-item:hover{background:#f5f7fb}.menu-icon{width:30px;height:30px;border-radius:9px;background:#f0f3ff;color:#586ee7;display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}.menu-item b{display:block;font-size:12px}.menu-item small{display:block;color:#8390a2;font-size:10px;line-height:1.35;margin-top:2px}
.action-line{height:18px;display:flex;justify-content:flex-end;align-items:center;margin:-3px 3px 6px;color:#78859a;font-size:10.5px;opacity:0;transition:.2s}.action-line.show{opacity:1}
.view-head{display:none;align-items:flex-end;justify-content:space-between;gap:14px;margin:3px 2px 10px}.view-head.show{display:flex}.view-title h2{margin:0;font-size:21px;letter-spacing:-.035em}.view-title p{margin:4px 0 0;color:var(--muted);font-size:11.5px}.mode-badge{display:inline-flex;align-items:center;border-radius:999px;background:#eef2ff;color:#5569c9;padding:6px 9px;font-size:10px;font-weight:850;white-space:nowrap}
.stats{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stats.show{display:grid}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow-sm)}.stat-label{font-size:10px;font-weight:850;letter-spacing:.055em;text-transform:uppercase;color:#7c8799}.stat-value{margin-top:5px;font-size:23px;line-height:1;font-weight:880;letter-spacing:-.04em}.stat-note{margin-top:5px;color:#8b96a8;font-size:10px;min-height:13px}
.section-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 2px 8px}.section-bar h3{margin:0;font-size:13px}.section-bar p{margin:3px 0 0;color:#8994a6;font-size:10.5px}.section-right{color:#8b96a8;font-size:10px;white-space:nowrap}
.schedule-shell{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}.schedule-grid{display:grid;grid-template-columns:76px repeat(5,minmax(176px,1fr));min-width:1040px}.ghead,.period,.slot{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.schedule-grid>*:nth-child(6n){border-right:0}.schedule-grid>*:nth-last-child(-n+6){border-bottom:0}.ghead{position:sticky;top:0;z-index:5;padding:12px 10px;text-align:center;background:rgba(249,250,253,.97);backdrop-filter:blur(8px);font-size:11.5px;font-weight:850;color:#536078}.ghead.corner{left:0;z-index:7}.period{position:sticky;left:0;z-index:4;display:grid;place-items:center;background:#fbfcfe;padding:12px 7px;font-size:11px;font-weight:850;color:#56647b}.slot{min-height:118px;padding:7px;background:#fff}.slot.blank{background:linear-gradient(145deg,#fff,#fdfdfe)}.empty{height:100%;min-height:102px}
.lesson{min-height:102px;border:1px solid var(--tone-border);background:linear-gradient(145deg,var(--tone-a),var(--tone-b));border-radius:13px;padding:10px 10px 9px;position:relative;overflow:hidden}.lesson+.lesson{margin-top:6px}.lesson:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tone-accent)}.lesson[data-tone="0"]{--tone-a:#f6f8ff;--tone-b:#eff3ff;--tone-border:#dfe6ff;--tone-accent:#6078f2}.lesson[data-tone="1"]{--tone-a:#f4fbf8;--tone-b:#edf8f4;--tone-border:#d9eee6;--tone-accent:#2aa481}.lesson[data-tone="2"]{--tone-a:#fff9f0;--tone-b:#fff5e7;--tone-border:#f5e5cb;--tone-accent:#d99738}.lesson[data-tone="3"]{--tone-a:#faf6ff;--tone-b:#f5efff;--tone-border:#e7dcfa;--tone-accent:#8d69dc}.lesson[data-tone="4"]{--tone-a:#fff6f8;--tone-b:#fdf0f3;--tone-border:#f1dde3;--tone-accent:#d97791}.lesson[data-tone="5"]{--tone-a:#f4faff;--tone-b:#edf7ff;--tone-border:#d8eafa;--tone-accent:#4d97cc}.subject{font-size:12.5px;font-weight:880;line-height:1.3}.classcode{display:inline-flex;margin:6px 0 5px;border-radius:999px;padding:3px 7px;background:rgba(255,255,255,.72);border:1px solid rgba(86,106,145,.10);font-size:9.5px;font-weight:850;color:#465571}.meta{display:grid;gap:2px;color:#68758a;font-size:10px;line-height:1.35}.meta-row{display:flex;gap:5px;min-width:0}.meta-row span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count-badge{margin-top:6px;display:inline-flex;border-radius:999px;background:rgba(255,255,255,.68);padding:3px 6px;color:#6f7b8e;font-size:9px;font-weight:800}
.roster{display:none;margin-top:12px}.roster.show{display:block}.roster-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden}.roster-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}.roster-head h3{margin:0;font-size:13px}.roster-head span{font-size:10.5px;color:#7e899b}.table-wrap{overflow:auto}.roster table{width:100%;border-collapse:collapse;min-width:620px}.roster th,.roster td{padding:9px 13px;border-bottom:1px solid #eef1f5;text-align:left;font-size:11.5px}.roster th{background:#fafbfc;color:#6f7b8f;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}.roster tr:last-child td{border-bottom:0}.roster td:nth-child(1),.roster th:nth-child(1){width:58px;text-align:center}.roster td:nth-child(2),.roster th:nth-child(2){width:105px}.roster td:nth-child(4),.roster th:nth-child(4){width:90px}
.footer{display:flex;justify-content:space-between;gap:12px;margin:13px 3px 0;color:#9aa4b3;font-size:9.5px}
@media(max-width:900px){.app{padding:14px}.control{grid-template-columns:1fr auto}.segmented{grid-column:1/-1;width:100%}.seg{flex:1}.search-wrap{min-width:0}.stats{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.brand p{display:none}.live-chip{max-width:58vw;overflow:hidden;text-overflow:ellipsis}.view-head{align-items:flex-start}.section-right{display:none}}
@media(max-width:560px){.app{padding:11px}.logo{width:40px;height:40px;border-radius:13px}.brand h1{font-size:17px}.live-wrap{gap:5px}.live-chip{padding:7px 9px;font-size:10px;max-width:51vw}.control{padding:9px;border-radius:16px;gap:8px}.seg{padding:8px 7px;font-size:10.5px}.export-btn{padding:0 11px}.export-btn .export-label{display:none}.stats{gap:7px}.stat{padding:11px 12px}.stat-value{font-size:20px}.view-title h2{font-size:18px}.mode-badge{display:none}.schedule-shell{border-radius:15px}.footer{display:none}}
@media print{body{background:#fff}.topbar,.control,.action-line,.section-bar,.footer{display:none!important}.app{padding:0}.schedule-shell{box-shadow:none;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">TKB</div><div><h1>Thời khóa biểu lớp 10</h1><p>Tra cứu theo học sinh, giáo viên và mã lớp</p></div></div>
    <div class="live-wrap">
      <div class="live-chip wait" id="liveChip"><span class="live-dot"></span><span id="liveText">Đang cập nhật dữ liệu…</span></div>
      <button class="icon-btn" id="syncBtn" title="Cập nhật ngay" aria-label="Cập nhật ngay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </header>

  <section class="control">
    <div class="segmented" role="tablist" aria-label="Chế độ xem">
      <button class="seg active" data-mode="student">Học sinh</button>
      <button class="seg" data-mode="teacher">Giáo viên</button>
      <button class="seg" data-mode="class">Mã lớp</button>
    </div>
    <div class="search-wrap">
      <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" autocomplete="off" placeholder="Tìm tên hoặc mã học sinh…" aria-label="Tìm kiếm"></div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="export-wrap">
      <button class="export-btn" id="exportBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="export-label">Xuất file</span></button>
      <div class="export-menu" id="exportMenu">
        <button class="menu-item" id="excelBtn"><span class="menu-icon">XLS</span><span><b>Excel tổng hợp</b><small>Grid, chi tiết và danh sách học sinh</small></span></button>
        <button class="menu-item" id="pdfBtn"><span class="menu-icon">PDF</span><span><b>PDF A4 dọc</b><small>Tên file tự điền khi lưu</small></span></button>
        <button class="menu-item" id="pngBtn"><span class="menu-icon">PNG</span><span><b>Ảnh điện thoại</b><small>1080 × 2400 dùng làm hình nền</small></span></button>
      </div>
    </div>
  </section>
  <div class="action-line" id="actionLine"></div>

  <section class="view-head" id="viewHead">
    <div class="view-title"><h2 id="viewTitle"></h2><p id="viewSub"></p></div>
    <span class="mode-badge" id="modeBadge"></span>
  </section>
  <section class="stats" id="stats"></section>

  <div class="section-bar"><div><h3>Thời khóa biểu</h3><p>Hàng là tiết · cột là thứ · mỗi ô hiển thị đầy đủ thông tin lớp</p></div><div class="section-right" id="gridNote"></div></div>
  <section class="schedule-shell"><div class="schedule-grid" id="scheduleGrid"></div></section>

  <section class="roster" id="roster"><div class="roster-card"><div class="roster-head"><h3 id="rosterTitle">Danh sách học sinh</h3><span id="rosterMeta"></span></div><div class="table-wrap"><table><thead><tr><th>STT</th><th>Mã HS</th><th>Họ và tên</th><th>Lớp gốc</th></tr></thead><tbody id="rosterBody"></tbody></table></div></div></section>
  <footer class="footer"><span>Thời khóa biểu lớp 10</span><span id="footerTime"></span></footer>
</div>

function renderRoster(v){if(!v.roster.length){els.roster.classList.remove('show');return}els.rosterTitle.textContent=state.mode==='class'?`Danh sách học sinh ${v.title}`:`Học sinh liên quan`;els.rosterMeta.textContent=`${v.roster.length} học sinh`;els.rosterBody.innerHTML=v.roster.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.id)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.homeClass)}</td></tr>`).join('');els.roster.classList.add('show')}
function renderView(){const v=currentView();if(!v)return clearView();els.viewTitle.textContent=v.title;els.viewSub.textContent=v.sub;els.modeBadge.textContent=v.badge;els.viewHead.classList.add('show');renderStats(v);renderGrid(v.m);renderRoster(v);const occupied=PERIODS.reduce((n,p)=>n+DAYS.filter(d=>(v.m[key(d,p)]||[]).length).length,0);els.gridNote.textContent=`${occupied}/20 ô có lịch`;els.exportBtn.disabled=false}
function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows}
async function loadViaGviz(){const url=`https://docs.google.com/spreadsheets/d/${LIVE_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(LIVE_SHEET)}&_=${Date.now()}`;const r=await fetch(url,{cache:'no-store',credentials:'include'});if(!r.ok)throw new Error('sync');const text=await r.text();const rows=parseCsv(text);if(rows.length<2||!rows[0].includes('Student_ID'))throw new Error('format');return rows}
function loadViaAppsScript(){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(p=>resolve(p)).withFailureHandler(()=>reject(new Error('sync'))).getLiveData())}
async function syncLive({silent=false}={}){if(!silent)updateLive(true);try{let payload;if(window.google?.script?.run)payload=await loadViaAppsScript();else payload={values:await loadViaGviz(),updatedAt:new Date().toISOString()};applyRows(payload.values||payload,'live',payload.updatedAt||new Date().toISOString());if(!silent)action('Đã cập nhật dữ liệu mới nhất')}catch(e){state.source='fallback';updateLive(false);if(!silent)action('Chưa đồng bộ được, đang giữ dữ liệu gần nhất')}finally{if(!silent)updateLive(false)}}
function safeName(s){return clean(s).replace(/[\\/:*?"<>|]/g,'_').slice(0,80)}function ensureView(){return state.selection?currentView():null}
function detailRows(v){const out=[];for(const p of PERIODS)for(const d of DAYS)for(const x of v.m[key(d,p)]||[]){const l=x.lesson;out.push([`Thứ ${d}`,p,l.subject,l.code,l.teacher,l.room,x.count||''])}return out}
function exportExcel(){const v=ensureView();if(!v)return;if(!window.XLSX){action('Không tải được thư viện Excel');return}const wb=XLSX.utils.book_new();let ws=XLSX.utils.aoa_to_sheet([['THỜI KHÓA BIỂU'],['Đối tượng',v.title],['Thông tin',v.sub],['Cập nhật đến',fmt(state.lastSync)]]);ws['!cols']=[{wch:18},{wch:54}];XLSX.utils.book_append_sheet(wb,ws,'Tong quan');const grid=[['Tiết',...DAYS.map(d=>`Thứ ${d}`)]];for(const p of PERIODS)grid.push([`Tiết ${p}`,...DAYS.map(d=>(v.m[key(d,p)]||[]).map(x=>[x.lesson.subject,x.lesson.code,x.lesson.teacher,x.lesson.room].filter(Boolean).join(' · ')).join('\n'))]);ws=XLSX.utils.aoa_to_sheet(grid);ws['!cols']=[{wch:10},...DAYS.map(()=>({wch:38}))];ws['!rows']=grid.map((_,i)=>({hpt:i?54:22}));XLSX.utils.book_append_sheet(wb,ws,'Grid TKB');ws=XLSX.utils.aoa_to_sheet([['Thứ','Tiết','Môn học','Mã lớp','Giáo viên','Phòng','Số HS'],...detailRows(v)]);ws['!cols']=[{wch:10},{wch:8},{wch:20},{wch:18},{wch:28},{wch:18},{wch:9}];XLSX.utils.book_append_sheet(wb,ws,'Chi tiet');if(v.roster.length){ws=XLSX.utils.aoa_to_sheet([['STT','Mã HS','Họ và tên','Lớp gốc'],...v.roster.map((s,i)=>[i+1,s.id,s.name,s.homeClass])]);ws['!cols']=[{wch:7},{wch:12},{wch:34},{wch:11}];XLSX.utils.book_append_sheet(wb,ws,'Danh sach HS')}XLSX.writeFile(wb,`${safeName(v.title)}_TKB.xlsx`);action('Đã xuất Excel')}
function pdfSuggestedName(v){return`TKB - ${safeName(v.title)}`}
function printableHtml(v){const fileTitle=pdfSuggestedName(v);const rows=PERIODS.map(p=>`<tr><th>Tiết ${p}</th>${DAYS.map(d=>`<td>${(v.m[key(d,p)]||[]).map(x=>{const l=x.lesson;return`<div class="l"><b>${esc(l.subject)}</b>${l.code?`<span>${esc(l.code)}</span>`:''}<small>${[l.teacher,l.room].filter(Boolean).map(esc).join(' · ')}</small></div>`}).join('')||'—'}</td>`).join('')}</tr>`).join('');const roster=v.roster.length?`<section class="roster-section"><h2>Danh sách học sinh <span>(${v.roster.length})</span></h2><table class="r"><thead><tr><th>STT</th><th>Mã HS</th><th>Họ và tên</th><th>Lớp gốc</th></tr></thead><tbody>${v.roster.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.homeClass)}</td></tr>`).join('')}</tbody></table></section>`:'';return`<!doctype html><html><head><meta charset="utf-8"><title>${esc(fileTitle)}</title><style>@page{size:A4 portrait;margin:8mm 7mm 9mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{width:100%;margin:0;padding:0}body{font-family:Arial,"Segoe UI",sans-serif;color:#172033;font-size:8pt;line-height:1.28}.print-head{display:flex;align-items:flex-end;justify-content:space-between;gap:6mm;margin:0 0 4mm}.print-head h1{font-size:15pt;line-height:1.1;margin:0 0 1mm}.print-head p{margin:0;color:#667085;font-size:8.5pt}.updated{white-space:nowrap;color:#7b8493;font-size:7.2pt;padding-bottom:.5mm}h2{font-size:11pt;margin:6mm 0 2.2mm;color:#1f2937}h2 span{font-weight:500;color:#667085}table{width:100%;border-collapse:collapse}table.t{table-layout:fixed;border:1px solid #cfd6df}th,td{border:1px solid #cfd6df;vertical-align:top}table.t th,table.t td{padding:2mm 1.7mm}table.t thead th{background:#f1f4f8;text-align:center;font-size:7.8pt;font-weight:700}table.t th:first-child{width:12mm;text-align:center;vertical-align:middle;background:#f7f8fa}.l{min-height:11mm}.l+.l{border-top:1px dashed #d8dde5;margin-top:1.6mm;padding-top:1.6mm}.l b{display:block;font-size:7.8pt;line-height:1.22;color:#172033}.l span{display:inline-block;margin:.8mm 0 .7mm;padding:.45mm 1.1mm;background:#eef2ff;border-radius:2.6mm;font-size:6.5pt;font-weight:700;color:#465bb4}.l small{display:block;color:#606b7c;font-size:6.6pt;line-height:1.25;overflow-wrap:anywhere}.roster-section{break-before:auto}.r{table-layout:auto;font-size:7.8pt}.r th,.r td{padding:1.8mm 2mm;border:1px solid #d6dbe3}.r thead th{background:#f3f5f8;font-size:7.3pt}.r th:nth-child(1),.r td:nth-child(1){width:12mm;text-align:center}.r th:nth-child(2),.r td:nth-child(2){width:25mm}.r th:nth-child(4),.r td:nth-child(4){width:22mm}tr{break-inside:avoid;page-break-inside:avoid}thead{display:table-header-group}.note{margin-top:2.5mm;color:#7e8795;font-size:6.8pt;text-align:right}@media print{body{background:#fff}}</style></head><body><div class="print-head"><div><h1>${esc(v.title)}</h1><p>${esc(v.sub)}</p></div><div class="updated">Cập nhật ${fmt(state.lastSync)}</div></div><table class="t"><thead><tr><th>Tiết</th>${DAYS.map(d=>`<th>Thứ ${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${roster}<div class="note">Khổ A4 dọc</div><script>window.onload=()=>{document.title=${JSON.stringify(fileTitle)};window.focus();setTimeout(()=>window.print(),220)}<\/script></body></html>`}
function exportPdf(){const v=ensureView();if(!v)return;const w=window.open('','_blank');if(!w){action('Trình duyệt đang chặn cửa sổ in');return}w.document.open();w.document.write(printableHtml(v));w.document.close();action(`PDF A4 dọc · tên lưu: ${pdfSuggestedName(v)}`)}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function wrap(ctx,text,x,y,maxW,lineH,max=4){const words=clean(text).split(/\s+/),lines=[];let line='';for(const word of words){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);const use=lines.slice(0,max);if(lines.length>max)use[max-1]=use[max-1].replace(/\s+\S*$/,'')+'…';use.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));return use.length*lineH}
function exportPng(){const v=ensureView();if(!v)return;const c=document.createElement('canvas');c.width=1080;c.height=2400;const ctx=c.getContext('2d'),g=ctx.createLinearGradient(0,0,1080,2400);g.addColorStop(0,'#f8faff');g.addColorStop(1,'#eef2fb');ctx.fillStyle=g;ctx.fillRect(0,0,1080,2400);ctx.fillStyle='#18233a';ctx.font='800 48px Arial';wrap(ctx,v.title,58,92,940,58,2);ctx.fillStyle='#6f7c91';ctx.font='23px Arial';wrap(ctx,v.sub,58,210,940,32,2);ctx.fillStyle='#fff';roundRect(ctx,50,300,980,1825,32);const x0=68,y0=342,labelW=82,colW=174,rowH=420;ctx.textAlign='center';ctx.fillStyle='#556279';ctx.font='700 21px Arial';DAYS.forEach((d,i)=>ctx.fillText(`Thứ ${d}`,x0+labelW+i*colW+colW/2,y0+26));for(let pi=0;pi<4;pi++){const p=PERIODS[pi],y=y0+52+pi*rowH;ctx.fillStyle='#7e899c';ctx.font='700 19px Arial';ctx.fillText(`Tiết ${p}`,x0+labelW/2,y+42);for(let di=0;di<4;di++){const d=DAYS[di],x=x0+labelW+di*colW+5;ctx.fillStyle='#f6f8fc';roundRect(ctx,x,y,colW-10,rowH-12,18);const list=v.m[key(d,p)]||[];ctx.textAlign='left';let ty=y+32;if(!list.length){ctx.fillStyle='#b4bdca';ctx.font='16px Arial';ctx.fillText('—',x+15,ty)}else list.slice(0,2).forEach((it,n)=>{if(n){ctx.fillStyle='#dfe4ec';ctx.fillRect(x+14,ty-7,colW-38,1);ty+=18}const l=it.lesson;ctx.fillStyle='#1b263b';ctx.font='700 16px Arial';ty+=wrap(ctx,l.subject,x+12,ty,colW-30,22,3)+6;ctx.fillStyle='#5368cc';ctx.font='700 12px Arial';if(l.code){ctx.fillText(l.code,x+12,ty);ty+=20}ctx.fillStyle='#6b778b';ctx.font='12px Arial';ty+=wrap(ctx,l.teacher,x+12,ty,colW-30,18,3)+3;if(l.room)ty+=wrap(ctx,l.room,x+12,ty,colW-30,18,2)+3})}}ctx.textAlign='left';ctx.fillStyle='#6f7c91';ctx.font='17px Arial';ctx.fillText(`Cập nhật ${fmt(state.lastSync)}`,58,2200);ctx.fillStyle='#ffffff';roundRect(ctx,58,2260,405,80,20);ctx.fillStyle='#576ad2';ctx.font='700 17px Arial';ctx.fillText('1080 × 2400 · Mobile Wallpaper',82,2309);const a=document.createElement('a');a.download=`${safeName(v.title)}_mobile.png`;a.href=c.toDataURL('image/png');a.click();action('Đã xuất ảnh PNG')}
$$('.seg').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));els.search.addEventListener('focus',renderSuggestions);els.search.addEventListener('input',renderSuggestions);els.search.addEventListener('keydown',e=>{const opts=$$('.option[data-key]');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!opts.length)return;state.activeOption=(state.activeOption+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts.forEach((o,i)=>o.classList.toggle('active',i===state.activeOption));opts[state.activeOption]?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();const o=opts[state.activeOption]||opts[0];if(o)select(o.dataset.key)}else if(e.key==='Escape')closeSuggestions()});document.addEventListener('mousedown',e=>{if(!e.target.closest('.search-wrap'))closeSuggestions();if(!e.target.closest('.export-wrap'))els.exportMenu.classList.remove('open')});els.exportBtn.addEventListener('click',e=>{e.stopPropagation();if(!els.exportBtn.disabled)els.exportMenu.classList.toggle('open')});$('#excelBtn').onclick=()=>{els.exportMenu.classList.remove('open');exportExcel()};$('#pdfBtn').onclick=()=>{els.exportMenu.classList.remove('open');exportPdf()};$('#pngBtn').onclick=()=>{els.exportMenu.classList.remove('open');exportPng()};els.syncBtn.onclick=()=>syncLive();
applyRows(FALLBACK_ROWS,'fallback',FALLBACK_UPDATED_AT);clearView();syncLive({silent:true});setInterval(()=>{if(document.visibilityState==='visible')syncLive({silent:true})},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-state.lastSync.getTime()>60000)syncLive({silent:true})});
