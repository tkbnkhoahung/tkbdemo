<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thời Khóa Biểu Tự Chọn Lớp 12 - THPT Nguyễn Khuyến</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-700 mb-2">Tra Cứu Thời Khóa Biểu</h1>
            <p class="text-slate-500 font-medium">Hệ thống môn tự chọn Lớp 12 - THPT Nguyễn Khuyến</p>
        </header>

        <!-- Khung tìm kiếm -->
        <div class="glass-card rounded-2xl shadow-sm p-6 mb-8">
            <div id="loading" class="text-center text-blue-600 py-4 font-medium flex items-center justify-center gap-2">
                <i class="fas fa-circle-notch fa-spin"></i> Đang đồng bộ dữ liệu hệ thống...
            </div>
            
            <div id="search-container" class="hidden">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fas fa-search text-slate-400"></i>
                    </div>
                    <input type="text" id="searchInput" 
                        class="w-full pl-11 pr-4 py-3 md:py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg shadow-inner"
                        placeholder="Nhập họ và tên học sinh (VD: Nguyễn Văn A)...">
                </div>
                <div class="flex items-center gap-2 mt-3 ml-2 text-sm text-slate-400">
                    <i class="fas fa-info-circle"></i> 
                    <span>Hệ thống cập nhật thời gian thực. Hỗ trợ tìm kiếm không dấu.</span>
                </div>
            </div>
        </div>

        <!-- Khu vực hiển thị kết quả -->
        <div id="results" class="space-y-6"></div>
    </div>

    <script>
        // ==========================================
        // DÁN LINK WEB APP (API) TỪ GOOGLE SCRIPT VÀO ĐÂY
        // ==========================================
        const apiUrl = 'THAY_BANG_LINK_WEB_APP_CUA_BAN';
        
        let studentsData = [];

        // Khởi tạo và tải dữ liệu bằng fetch API
        document.addEventListener('DOMContentLoaded', () => {
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    studentsData = data;
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('search-container').classList.remove('hidden');
                    
                    // Lắng nghe sự kiện gõ phím
                    document.getElementById('searchInput').addEventListener('input', debounce(searchStudent, 300));
                })
                .catch(error => {
                    console.error("Lỗi tải dữ liệu:", error);
                    document.getElementById('loading').innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-triangle"></i> Lỗi kết nối! Vui lòng kiểm tra lại link API.</span>';
                });
        });

        // Hàm trì hoãn tìm kiếm (chống lag khi gõ nhanh)
        function debounce(func, wait) {
            let timeout;
            return function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, arguments), wait);
            };
        }

        // Loại bỏ dấu tiếng Việt
        function removeAccents(str) {
            if(!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // Xử lý logic tìm kiếm
        function searchStudent() {
            const query = removeAccents(document.getElementById('searchInput').value.trim());
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            if (query.length < 2) return;

            const filtered = studentsData.filter(row => {
                const name = removeAccents(row['Họ và tên']);
                return name.includes(query);
            });

            if (filtered.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="text-center text-slate-500 py-10 bg-white rounded-2xl border border-slate-100 animate-fade-in">
                        <i class="fas fa-user-slash text-4xl mb-3 text-slate-300"></i>
                        <p>Không tìm thấy học sinh nào phù hợp.</p>
                    </div>`;
                return;
            }

            // Hiển thị tối đa 10 kết quả
            filtered.slice(0, 10).forEach(student => {
                resultsDiv.innerHTML += generateStudentCard(student);
            });
            
            if (filtered.length > 10) {
                resultsDiv.innerHTML += `<p class="text-center text-slate-400 text-sm mt-4 font-medium animate-fade-in">Còn ${filtered.length - 10} kết quả khác. Vui lòng gõ tên đầy đủ hơn.</p>`;
            }
        }

        // Tạo giao diện cho từng môn học
        function generateSubjectCard(title, subject, day, shift, room, teacher, classCode) {
            if (!subject || subject.trim() === '') return '';
            return `
                <div class="bg-slate-50/70 p-4 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm shadow-sm">
                            ${title === 'Môn 3' ? '3' : '4'}
                        </div>
                        <h4 class="font-bold text-lg text-slate-800">${subject}</h4>
                    </div>
                    <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-slate-600">
                        <div class="flex items-center gap-2"><i class="fas fa-calendar-day w-4 text-slate-400"></i> <span class="font-medium text-slate-700">${day}</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-clock w-4 text-slate-400"></i> <span class="font-medium text-slate-700">Ca ${shift}</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-map-marker-alt w-4 text-slate-400"></i> <span class="font-medium text-slate-700">P. ${room}</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-chalkboard-teacher w-4 text-slate-400"></i> <span class="font-medium text-slate-700 truncate" title="${teacher}">${teacher}</span></div>
                        <div class="col-span-2 flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-200 mt-1">
                            <i class="fas fa-fingerprint text-slate-400"></i> 
                            <span class="font-mono text-slate-700 font-medium">Mã lớp: ${classCode}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Tạo giao diện tổng thể của một học sinh
        function generateStudentCard(student) {
            const mon3Html = generateSubjectCard('Môn 3', student['Môn 3'], student['Thứ Môn 3'], student['Ca Môn 3'], student['Phòng Môn 3'], student['Giáo viên Môn 3'], student['Mã lớp Môn 3']);
            const mon4Html = generateSubjectCard('Môn 4', student['Môn 4'], student['Thứ Môn 4'], student['Ca Môn 4'], student['Phòng Môn 4'], student['Giáo viên Môn 4'], student['Mã lớp Môn 4']);

            return `
                <div class="glass-card rounded-2xl shadow-sm overflow-hidden animate-fade-in border border-slate-200">
                    <div class="bg-gradient-to-r from-blue-700 to-blue-500 px-6 py-4 flex justify-between items-center text-white">
                        <div>
                            <h3 class="text-xl font-bold tracking-wide">${student['Họ và tên']}</h3>
                            <div class="flex items-center gap-3 text-blue-100 text-sm mt-1.5 font-medium">
                                <span class="bg-blue-800/30 px-2 py-0.5 rounded">Lớp: ${student['Lớp']}</span>
                                <span class="bg-blue-800/30 px-2 py-0.5 rounded">STT: ${student['STT']}</span>
                            </div>
                        </div>
                        <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-user-graduate text-2xl text-white"></i>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            ${mon3Html}
                            ${mon4Html}
                        </div>
                        ${(!student['Môn 3'] && !student['Môn 4']) ? 
                            '<div class="text-slate-400 italic text-center py-4 bg-slate-50 rounded-xl border border-slate-100"><i class="fas fa-box-open mb-2 text-xl"></i><br>Chưa có dữ liệu môn học tự chọn.</div>' : ''}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
