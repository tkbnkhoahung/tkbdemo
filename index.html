<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3d66" />
  <title>Tra cứu thời khóa biểu</title>
  <meta name="description" content="Tra cứu thời khóa biểu theo học sinh, giáo viên và mã lớp." />
  <link rel="preconnect" href="https://docs.google.com">
  <style>
:root{
  --navy:#0f3d66;
  --navy-2:#15558b;
  --ink:#162435;
  --muted:#667789;
  --line:#dbe4ec;
  --soft:#f5f8fb;
  --white:#fff;
  --success:#17854b;
  --danger:#b93838;
  --shadow:0 10px 28px rgba(26,56,84,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f7;color:var(--ink)}
body{margin:0;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh}
.hero{background:linear-gradient(135deg,#0f3d66,#1766a4);color:white;padding:34px 20px 28px}
.hero-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;opacity:.8;margin-bottom:8px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:0 0 12px}
.hero-copy{margin:0;max-width:680px;opacity:.9;line-height:1.6}
.secondary-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:white;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
.secondary-btn:hover{background:rgba(255,255,255,.18)}
.status-row{max-width:1180px;margin:18px auto 0;font-size:13px;display:flex;align-items:center;gap:8px;opacity:.92}
.status-dot{width:9px;height:9px;border-radius:50%;background:#cbd5df;display:inline-block}
.status-dot.ok{background:#52d68a;box-shadow:0 0 0 4px rgba(82,214,138,.15)}
.status-dot.loading{background:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.15)}
.status-dot.error{background:#ff7b7b;box-shadow:0 0 0 4px rgba(255,123,123,.15)}
.status-sep{opacity:.45}
.container{max-width:1180px;margin:-8px auto 0;padding:0 20px 52px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}
.stat-card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 4px 18px rgba(20,50,80,.05)}
.stat-number{font-size:30px;font-weight:850;color:var(--navy)}
.stat-label{font-size:13px;color:var(--muted);margin-top:4px}
.search-panel{position:relative;background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);z-index:3}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:white;color:var(--muted);border-radius:999px;padding:9px 15px;font-weight:750}
.tab.active{background:var(--navy);border-color:var(--navy);color:white}
.search-wrap{position:relative}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:24px;color:#8191a1;pointer-events:none}
#searchInput{width:100%;height:52px;border:1px solid #cdd9e3;border-radius:14px;padding:0 48px 0 47px;outline:none;background:#fbfdff;color:var(--ink)}
#searchInput:focus{border-color:#4c8ac0;box-shadow:0 0 0 4px rgba(42,111,168,.10);background:white}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#7b8b99;font-size:28px;line-height:1}
.search-hint{font-size:12px;color:var(--muted);margin-top:10px}
.suggestions{position:absolute;left:20px;right:20px;top:126px;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 38px rgba(20,50,80,.16);max-height:320px;overflow:auto;z-index:20}
.suggestion{padding:12px 14px;border-bottom:1px solid #edf2f6;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center}
.suggestion:last-child{border-bottom:0}
.suggestion:hover,.suggestion.active{background:#f1f7fc}
.suggestion-main{font-weight:760}
.suggestion-sub{font-size:12px;color:var(--muted);margin-top:3px}
.suggestion-badge{font-size:11px;color:var(--navy);background:#e9f2fa;border-radius:999px;padding:5px 8px;white-space:nowrap}
.hidden{display:none!important}
.message-box{margin-top:18px;background:white;border:1px solid var(--line);border-radius:14px;padding:16px}
.message-box.error{border-color:#f0c1c1;background:#fff8f8;color:#862e2e}
.result-area{margin-top:22px}
.profile-card,.section-card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 22px rgba(20,50,80,.06);overflow:hidden}
.profile-card{padding:22px;margin-bottom:16px}
.profile-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.profile-title{margin:0;font-size:26px}
.profile-sub{margin:5px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{padding:7px 10px;background:#f2f6f9;border:1px solid #e0e8ef;border-radius:999px;font-size:12px}
.section-card{margin-top:16px}
.section-title{padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:850;display:flex;justify-content:space-between;gap:16px;align-items:center}
.section-note{font-size:12px;color:var(--muted);font-weight:500}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:13px 14px;border-bottom:1px solid #e9eff4;text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#607184;background:#f7fafc}
td{font-size:14px}
tr:last-child td{border-bottom:0}
.schedule-grid{display:grid;grid-template-columns:130px 1fr 1fr}
.schedule-grid>div{min-height:94px;border-right:1px solid #e8eef3;border-bottom:1px solid #e8eef3;padding:14px}
.schedule-grid .head{min-height:auto;background:#f7fafc;font-size:12px;font-weight:800;color:#607184;text-transform:uppercase}
.schedule-grid .day{font-weight:850;background:#fbfcfd}
.lesson-title{font-weight:850;margin-bottom:4px}
.lesson-code{display:inline-block;font-size:11px;font-weight:800;color:#0f568f;background:#e8f2fa;border-radius:6px;padding:3px 6px;margin-bottom:7px}
.lesson-meta{font-size:12px;color:#5d6d7d;line-height:1.55}
.empty{color:#a1afbb}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 20px 20px}
.roster-item{border:1px solid #e1e9ef;border-radius:11px;padding:10px 12px;background:#fbfdff}
.roster-name{font-weight:720;font-size:13px}
.roster-class{font-size:11px;color:var(--muted);margin-top:3px}
.kpi-inline{display:flex;gap:10px;flex-wrap:wrap}
.kpi-pill{font-size:12px;border:1px solid #dbe5ed;border-radius:10px;padding:7px 9px;background:#f8fbfd}
footer{color:#7c8b99;text-align:center;font-size:12px;padding:24px}
@media(max-width:800px){
  .hero-inner{display:block}
  .secondary-btn{margin-top:18px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .schedule-grid{grid-template-columns:88px 1fr 1fr}
  .roster{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .container{padding-left:12px;padding-right:12px}
  .hero{padding-left:16px;padding-right:16px}
  .stats-grid{gap:8px}
  .stat-card{padding:14px}
  .stat-number{font-size:25px}
  .search-panel{padding:14px}
  .suggestions{left:14px;right:14px;top:120px}
  .schedule-grid{display:block}
  .schedule-grid .head{display:none}
  .schedule-grid .day{border-top:8px solid #eef3f7;min-height:auto}
  .schedule-grid>div{border-right:0}
  .schedule-grid .lesson::before{content:attr(data-ca);display:block;font-size:11px;font-weight:800;color:#738495;text-transform:uppercase;margin-bottom:7px}
  .roster{grid-template-columns:1fr}
  .profile-top{display:block}
}
@media print{
  .hero,.stats-grid,.search-panel,footer{display:none!important}
  body,html{background:white}
  .container{max-width:none;margin:0;padding:0}
  .profile-card,.section-card{box-shadow:none;border:0}
}

</style>

<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-inner">
        <div>
          <div class="eyebrow">THỜI KHÓA BIỂU</div>
          <h1>Tra cứu lịch học</h1>
          <p class="hero-copy">Tìm nhanh theo học sinh, giáo viên hoặc mã lớp. Dữ liệu được tải trực tiếp từ Google Sheets.</p>
        </div>
        <button id="refreshBtn" class="secondary-btn" type="button" aria-label="Làm mới dữ liệu">
          <span aria-hidden="true">↻</span> Làm mới
        </button>
      </div>
      <div class="status-row">
        <span id="statusDot" class="status-dot loading"></span>
        <span id="statusText">Đang tải dữ liệu…</span>
        <span class="status-sep">•</span>
        <span id="updatedAt">—</span>
      </div>
    </header>

    <main class="container">
      <section class="stats-grid" aria-label="Thống kê">
        <article class="stat-card">
          <div id="studentCount" class="stat-number">—</div>
          <div class="stat-label">Học sinh</div>
        </article>
        <article class="stat-card">
          <div id="teacherCount" class="stat-number">—</div>
          <div class="stat-label">Giáo viên</div>
        </article>
        <article class="stat-card">
          <div id="classCount" class="stat-number">—</div>
          <div class="stat-label">Mã lớp</div>
        </article>
        <article class="stat-card">
          <div id="roomCount" class="stat-number">—</div>
          <div class="stat-label">Phòng</div>
        </article>
      </section>

      <section class="search-panel">
        <div class="tabs" role="tablist" aria-label="Kiểu tra cứu">
          <button class="tab active" data-mode="student" role="tab" aria-selected="true">Học sinh</button>
          <button class="tab" data-mode="teacher" role="tab" aria-selected="false">Giáo viên</button>
          <button class="tab" data-mode="class" role="tab" aria-selected="false">Mã lớp</button>
        </div>

        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Nhập tên học sinh hoặc lớp gốc…" aria-label="Tìm kiếm" />
          <button id="clearBtn" class="clear-btn hidden" type="button" aria-label="Xóa tìm kiếm">×</button>
        </div>
        <div id="suggestions" class="suggestions hidden" role="listbox"></div>
        <div class="search-hint" id="searchHint">Có thể nhập tên có dấu hoặc không dấu.</div>
      </section>

      <section id="messageBox" class="message-box hidden"></section>
      <section id="result" class="result-area" aria-live="polite"></section>
    </main>

    <footer>
      <div>Tra cứu thời khóa biểu • Dữ liệu từ Google Sheets</div>
    </footer>
  </div>

  <script>
window.APP_CONFIG = {
  spreadsheetId: "1vrR5oSkXy4jNSlwjODxnW43QS6-dOw7884eLlEka6s8",
  gid: "0",
  schoolName: "",
  // Nếu Google Sheet đổi tab, cập nhật gid ở đây.
  // Sheet phải được chia sẻ ở chế độ người có link có thể xem.
};

</script>
<script>
(() => {
  "use strict";

  const CONFIG = window.APP_CONFIG || {};
  const SPREADSHEET_ID = CONFIG.spreadsheetId;
  const GID = String(CONFIG.gid || "0");

  const state = {
    rows: [],
    columns: [],
    students: [],
    teachers: [],
    classes: [],
    slots: [],
    mode: "student",
    selected: null,
    activeSuggestion: -1,
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    statusDot: $("statusDot"),
    statusText: $("statusText"),
    updatedAt: $("updatedAt"),
    refreshBtn: $("refreshBtn"),
    searchInput: $("searchInput"),
    clearBtn: $("clearBtn"),
    suggestions: $("suggestions"),
    searchHint: $("searchHint"),
    messageBox: $("messageBox"),
    result: $("result"),
    studentCount: $("studentCount"),
    teacherCount: $("teacherCount"),
    classCount: $("classCount"),
    roomCount: $("roomCount"),
  };

  function normalizeText(value) {
    return String(value ?? "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "D")
      .toLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function csvParse(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            cell += '"';
            i++;
          } else {
            quoted = false;
          }
        } else {
          cell += ch;
        }
      } else {
        if (ch === '"') quoted = true;
        else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }
    }
    row.push(cell.replace(/\r$/, ""));
    if (row.some(v => v !== "")) rows.push(row);
    return rows;
  }

  function buildCsvUrl() {
    return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SPREADSHEET_ID)}/gviz/tq?tqx=out:csv&gid=${encodeURIComponent(GID)}&t=${Date.now()}`;
  }

  async function loadData() {
    setStatus("loading", "Đang tải dữ liệu…");
    hideMessage();
    els.refreshBtn.disabled = true;

    try {
      const response = await fetch(buildCsvUrl(), { cache: "no-store" });
      if (!response.ok) throw new Error(`Google Sheets trả về HTTP ${response.status}`);
      const text = await response.text();

      if (!text || /<!doctype html>|<html/i.test(text)) {
        throw new Error("Không đọc được CSV. Hãy kiểm tra quyền chia sẻ Google Sheet.");
      }

      const matrix = csvParse(text);
      if (matrix.length < 2) throw new Error("Google Sheet chưa có dữ liệu.");

      const columns = matrix[0].map(v => String(v || "").trim());
      const required = ["Họ và tên", "Lớp gốc"];
      const missing = required.filter(h => !columns.includes(h));
      if (missing.length) {
        throw new Error(`Thiếu cột bắt buộc: ${missing.join(", ")}`);
      }

      state.columns = columns;
      state.rows = matrix.slice(1)
        .filter(r => r.some(v => String(v).trim() !== ""))
        .map((values, index) => {
          const obj = {};
          columns.forEach((c, i) => obj[c] = String(values[i] ?? "").trim());
          obj.__row = index + 2;
          obj.__studentId = obj["Student_ID"] || `HS${String(index + 1).padStart(4, "0")}`;
          return obj;
        });

      state.slots = detectSlots(columns);
      if (!state.slots.length) {
        throw new Error("Không nhận diện được các cột thời khóa biểu. Tên cột phải có dạng “Sáng T2 - Ca 1 - Môn học/Mã lớp/Giáo viên/Phòng”.");
      }

      buildIndexes();
      updateStats();
      setStatus("ok", `Đã tải ${state.rows.length.toLocaleString("vi-VN")} học sinh`);
      els.updatedAt.textContent = `Cập nhật lúc ${new Date().toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit"})}`;

      if (state.selected) {
        const old = state.selected;
        state.selected = null;
        selectEntity(old.key);
      }
    } catch (err) {
      console.error(err);
      setStatus("error", "Không tải được dữ liệu");
      showMessage(
        `Không thể đọc Google Sheet. ${escapeHtml(err.message)} ` +
        `Hãy đặt quyền chia sẻ của Sheet thành <strong>“Bất kỳ ai có đường liên kết – Người xem”</strong>, rồi bấm <strong>Làm mới</strong>.`,
        true
      );
    } finally {
      els.refreshBtn.disabled = false;
    }
  }

  function detectSlots(columns) {
    const groups = new Map();
    const rx = /^(Sáng|Chiều)\s+T(\d+)\s*-\s*Ca\s*(\d+)\s*-\s*(Môn học|Mã lớp|Giáo viên|Phòng)$/i;
    columns.forEach(col => {
      const m = col.match(rx);
      if (!m) return;
      const period = titleCase(m[1]);
      const dayNumber = Number(m[2]);
      const ca = Number(m[3]);
      const field = normalizeText(m[4]);
      const key = `${period}|${dayNumber}|${ca}`;
      if (!groups.has(key)) groups.set(key, { period, dayNumber, ca, fields: {} });
      groups.get(key).fields[field] = col;
    });

    return [...groups.values()]
      .map(s => ({
        ...s,
        day: `Thứ ${s.dayNumber}`,
        subjectCol: s.fields["mon hoc"],
        codeCol: s.fields["ma lop"],
        teacherCol: s.fields["giao vien"],
        roomCol: s.fields["phong"],
      }))
      .filter(s => s.subjectCol && s.codeCol)
      .sort((a,b) => a.dayNumber - b.dayNumber || a.ca - b.ca);
  }

  function titleCase(s) {
    s = String(s || "").toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function getLessons(row) {
    return state.slots.map(slot => ({
      ...slot,
      subject: row[slot.subjectCol] || "",
      code: row[slot.codeCol] || "",
      teacher: slot.teacherCol ? (row[slot.teacherCol] || "") : "",
      room: slot.roomCol ? (row[slot.roomCol] || "") : "",
    })).filter(x => x.subject && normalizeText(x.subject) !== "trong" && x.code);
  }

  function buildIndexes() {
    state.students = state.rows.map(row => ({
      key: row.__studentId,
      name: row["Họ và tên"],
      originalClass: row["Lớp gốc"],
      row,
      search: normalizeText(`${row["Họ và tên"]} ${row["Lớp gốc"]}`),
    }));

    const teacherMap = new Map();
    const classMap = new Map();

    state.rows.forEach(row => {
      for (const lesson of getLessons(row)) {
        if (lesson.teacher) {
          const tKey = normalizeText(lesson.teacher);
          if (!teacherMap.has(tKey)) teacherMap.set(tKey, { key: tKey, name: lesson.teacher, search: tKey, lessons: [] });
          teacherMap.get(tKey).lessons.push({ ...lesson, student: row });
        }

        const cKey = normalizeText(lesson.code);
        if (!classMap.has(cKey)) {
          classMap.set(cKey, {
            key: cKey,
            code: lesson.code,
            subject: lesson.subject,
            teacher: lesson.teacher,
            room: lesson.room,
            period: lesson.period,
            day: lesson.day,
            dayNumber: lesson.dayNumber,
            ca: lesson.ca,
            students: [],
            search: normalizeText(`${lesson.code} ${lesson.subject} ${lesson.teacher}`)
          });
        }
        classMap.get(cKey).students.push(row);
      }
    });

    state.teachers = [...teacherMap.values()].sort((a,b) => a.name.localeCompare(b.name, "vi"));
    state.classes = [...classMap.values()].sort((a,b) => a.code.localeCompare(b.code, "vi"));
  }

  function updateStats() {
    const roomSet = new Set();
    state.rows.forEach(row => getLessons(row).forEach(x => { if (x.room) roomSet.add(x.room); }));
    els.studentCount.textContent = state.students.length.toLocaleString("vi-VN");
    els.teacherCount.textContent = state.teachers.length.toLocaleString("vi-VN");
    els.classCount.textContent = state.classes.length.toLocaleString("vi-VN");
    els.roomCount.textContent = roomSet.size.toLocaleString("vi-VN");
  }

  function setStatus(kind, text) {
    els.statusDot.className = `status-dot ${kind}`;
    els.statusText.textContent = text;
  }

  function showMessage(html, isError = false) {
    els.messageBox.innerHTML = html;
    els.messageBox.className = `message-box${isError ? " error" : ""}`;
  }

  function hideMessage() {
    els.messageBox.className = "message-box hidden";
    els.messageBox.innerHTML = "";
  }

  function currentList() {
    return state.mode === "student" ? state.students : state.mode === "teacher" ? state.teachers : state.classes;
  }

  function searchItems(query) {
    const q = normalizeText(query);
    if (!q) return [];
    return currentList()
      .filter(item => {
        if (state.mode === "student") return item.search.includes(q);
        if (state.mode === "teacher") return item.search.includes(q);
        return item.search.includes(q);
      })
      .slice(0, 12);
  }

  function renderSuggestions() {
    const q = els.searchInput.value;
    els.clearBtn.classList.toggle("hidden", !q);

    if (!q.trim()) {
      els.suggestions.classList.add("hidden");
      return;
    }

    const items = searchItems(q);
    if (!items.length) {
      els.suggestions.innerHTML = `<div class="suggestion"><div><div class="suggestion-main">Không tìm thấy</div><div class="suggestion-sub">Thử nhập một phần tên hoặc mã lớp.</div></div></div>`;
      els.suggestions.classList.remove("hidden");
      return;
    }

    state.activeSuggestion = -1;
    els.suggestions.innerHTML = items.map((item, i) => {
      if (state.mode === "student") {
        return `<div class="suggestion" data-key="${escapeHtml(item.key)}" data-index="${i}" role="option">
          <div><div class="suggestion-main">${escapeHtml(item.name)}</div><div class="suggestion-sub">Lớp gốc: ${escapeHtml(item.originalClass)}</div></div>
          <span class="suggestion-badge">Học sinh</span>
        </div>`;
      }
      if (state.mode === "teacher") {
        const uniqueClasses = uniqueClassSessions(item.lessons).length;
        return `<div class="suggestion" data-key="${escapeHtml(item.key)}" data-index="${i}" role="option">
          <div><div class="suggestion-main">${escapeHtml(item.name)}</div><div class="suggestion-sub">${uniqueClasses} lớp/ca</div></div>
          <span class="suggestion-badge">Giáo viên</span>
        </div>`;
      }
      return `<div class="suggestion" data-key="${escapeHtml(item.key)}" data-index="${i}" role="option">
        <div><div class="suggestion-main">${escapeHtml(item.code)}</div><div class="suggestion-sub">${escapeHtml(item.subject)} • ${escapeHtml(item.teacher || "Chưa có GV")}</div></div>
        <span class="suggestion-badge">${item.students.length} HS</span>
      </div>`;
    }).join("");

    els.suggestions.querySelectorAll(".suggestion[data-key]").forEach(el => {
      el.addEventListener("click", () => selectEntity(el.dataset.key));
    });
    els.suggestions.classList.remove("hidden");
  }

  function uniqueClassSessions(lessons) {
    const map = new Map();
    lessons.forEach(x => {
      const k = `${x.dayNumber}|${x.ca}|${normalizeText(x.code)}`;
      if (!map.has(k)) map.set(k, x);
    });
    return [...map.values()].sort((a,b) => a.dayNumber - b.dayNumber || a.ca - b.ca || a.code.localeCompare(b.code,"vi"));
  }

  function selectEntity(key) {
    let item;
    if (state.mode === "student") item = state.students.find(x => x.key === key);
    else if (state.mode === "teacher") item = state.teachers.find(x => x.key === key);
    else item = state.classes.find(x => x.key === key);
    if (!item) return;

    state.selected = { mode: state.mode, key };
    els.suggestions.classList.add("hidden");
    els.searchInput.value = state.mode === "student" ? item.name : state.mode === "teacher" ? item.name : item.code;
    els.clearBtn.classList.remove("hidden");
    hideMessage();

    if (state.mode === "student") renderStudent(item);
    else if (state.mode === "teacher") renderTeacher(item);
    else renderClass(item);
  }

  function lessonCell(lesson, ca) {
    if (!lesson) return `<div class="lesson" data-ca="Ca ${ca}"><span class="empty">—</span></div>`;
    return `<div class="lesson" data-ca="Ca ${ca}">
      <div class="lesson-title">${escapeHtml(lesson.subject)}</div>
      <div class="lesson-code">${escapeHtml(lesson.code)}</div>
      <div class="lesson-meta">
        ${lesson.teacher ? `GV: ${escapeHtml(lesson.teacher)}<br>` : ""}
        ${lesson.room ? `Phòng: ${escapeHtml(lesson.room)}` : ""}
      </div>
    </div>`;
  }

  function renderStudent(item) {
    const r = item.row;
    const lessons = getLessons(r);
    const byKey = new Map(lessons.map(x => [`${x.dayNumber}-${x.ca}`, x]));
    const days = [...new Set(state.slots.map(s => s.dayNumber))].sort((a,b) => a-b);

    const chips = [
      ["TC1", r["Môn tự chọn 1"]],
      ["TC2", r["Môn tự chọn 2"]],
      ["Thể dục", r["Thể dục tự chọn"]],
      ["CTNT", r["Chương trình nhà trường"]],
      ["AVBN", r["Đăng ký AVBN"]],
      ["MOS", r["Đăng ký MOS"]],
    ].filter(x => x[1]);

    const grid = `
      <div class="schedule-grid">
        <div class="head">Buổi</div><div class="head">Ca 1</div><div class="head">Ca 2</div>
        ${days.map(day => `
          <div class="day">Thứ ${day}</div>
          ${lessonCell(byKey.get(`${day}-1`),1)}
          ${lessonCell(byKey.get(`${day}-2`),2)}
        `).join("")}
      </div>`;

    els.result.innerHTML = `
      <article class="profile-card">
        <div class="profile-top">
          <div>
            <h2 class="profile-title">${escapeHtml(item.name)}</h2>
            <div class="profile-sub">Lớp gốc: <strong>${escapeHtml(item.originalClass)}</strong></div>
          </div>
          <div class="kpi-inline">
            <span class="kpi-pill">${lessons.length} lớp/hoạt động</span>
          </div>
        </div>
        <div class="chips">${chips.map(x => `<span class="chip"><strong>${escapeHtml(x[0])}:</strong> ${escapeHtml(x[1])}</span>`).join("")}</div>
      </article>
      <article class="section-card">
        <div class="section-title"><span>Thời khóa biểu</span><span class="section-note">Sáng • Ca 1–2</span></div>
        ${grid}
      </article>`;
  }

  function renderTeacher(item) {
    const lessons = uniqueClassSessions(item.lessons);
    const rows = lessons.map(l => {
      const roster = item.lessons.filter(x => x.dayNumber === l.dayNumber && x.ca === l.ca && normalizeText(x.code) === normalizeText(l.code));
      const uniqueStudents = new Set(roster.map(x => x.student.__studentId));
      return `<tr>
        <td>${escapeHtml(l.day)}</td>
        <td>Ca ${l.ca}</td>
        <td>${escapeHtml(l.subject)}</td>
        <td><strong>${escapeHtml(l.code)}</strong></td>
        <td>${escapeHtml(l.room || "—")}</td>
        <td>${uniqueStudents.size}</td>
      </tr>`;
    }).join("");

    els.result.innerHTML = `
      <article class="profile-card">
        <div class="profile-top">
          <div><h2 class="profile-title">${escapeHtml(item.name)}</h2><div class="profile-sub">Thời khóa biểu giáo viên</div></div>
          <div class="kpi-inline"><span class="kpi-pill">${lessons.length} lớp/ca</span></div>
        </div>
      </article>
      <article class="section-card">
        <div class="section-title"><span>Lịch dạy</span><span class="section-note">Đã gộp học sinh trùng mã lớp</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Thứ</th><th>Ca</th><th>Môn</th><th>Mã lớp</th><th>Phòng</th><th>Sĩ số</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </article>`;
  }

  function renderClass(item) {
    const students = [...new Map(item.students.map(s => [s.__studentId, s])).values()]
      .sort((a,b) => (a["Lớp gốc"] || "").localeCompare(b["Lớp gốc"] || "", "vi") || (a["Họ và tên"] || "").localeCompare(b["Họ và tên"] || "", "vi"));

    els.result.innerHTML = `
      <article class="profile-card">
        <div class="profile-top">
          <div>
            <h2 class="profile-title">${escapeHtml(item.code)}</h2>
            <div class="profile-sub">${escapeHtml(item.subject)} • ${escapeHtml(item.day)} • Ca ${item.ca}</div>
          </div>
          <div class="kpi-inline"><span class="kpi-pill">${students.length} học sinh</span></div>
        </div>
        <div class="chips">
          ${item.teacher ? `<span class="chip"><strong>Giáo viên:</strong> ${escapeHtml(item.teacher)}</span>` : ""}
          ${item.room ? `<span class="chip"><strong>Phòng:</strong> ${escapeHtml(item.room)}</span>` : ""}
        </div>
      </article>
      <article class="section-card">
        <div class="section-title"><span>Danh sách học sinh</span><span class="section-note">${students.length} học sinh</span></div>
        <div class="roster">
          ${students.map(s => `<div class="roster-item"><div class="roster-name">${escapeHtml(s["Họ và tên"])}</div><div class="roster-class">${escapeHtml(s["Lớp gốc"])}</div></div>`).join("")}
        </div>
      </article>`;
  }

  function setMode(mode) {
    state.mode = mode;
    state.selected = null;
    els.result.innerHTML = "";
    els.searchInput.value = "";
    els.clearBtn.classList.add("hidden");
    els.suggestions.classList.add("hidden");

    document.querySelectorAll(".tab").forEach(btn => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });

    if (mode === "student") {
      els.searchInput.placeholder = "Nhập tên học sinh hoặc lớp gốc…";
      els.searchHint.textContent = "Có thể nhập tên có dấu hoặc không dấu.";
    } else if (mode === "teacher") {
      els.searchInput.placeholder = "Nhập tên giáo viên…";
      els.searchHint.textContent = "Hiển thị lịch dạy đã gộp theo mã lớp.";
    } else {
      els.searchInput.placeholder = "Nhập mã lớp, ví dụ TC_TIN_9…";
      els.searchHint.textContent = "Hiển thị môn, giáo viên, phòng, thời gian và danh sách học sinh.";
    }
    els.searchInput.focus();
  }

  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => setMode(btn.dataset.mode)));
  els.searchInput.addEventListener("input", renderSuggestions);
  els.searchInput.addEventListener("focus", renderSuggestions);
  els.clearBtn.addEventListener("click", () => {
    els.searchInput.value = "";
    els.clearBtn.classList.add("hidden");
    els.suggestions.classList.add("hidden");
    els.result.innerHTML = "";
    state.selected = null;
    els.searchInput.focus();
  });
  els.refreshBtn.addEventListener("click", loadData);

  document.addEventListener("click", e => {
    if (!e.target.closest(".search-panel")) els.suggestions.classList.add("hidden");
  });

  els.searchInput.addEventListener("keydown", e => {
    const options = [...els.suggestions.querySelectorAll(".suggestion[data-key]")];
    if (!options.length || els.suggestions.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      state.activeSuggestion = Math.min(state.activeSuggestion + 1, options.length - 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      state.activeSuggestion = Math.max(state.activeSuggestion - 1, 0);
    } else if (e.key === "Enter" && state.activeSuggestion >= 0) {
      e.preventDefault();
      selectEntity(options[state.activeSuggestion].dataset.key);
      return;
    } else if (e.key === "Escape") {
      els.suggestions.classList.add("hidden");
      return;
    } else {
      return;
    }
    options.forEach((el,i) => el.classList.toggle("active", i === state.activeSuggestion));
    options[state.activeSuggestion]?.scrollIntoView({ block: "nearest" });
  });

  loadData();
})();

</script>
</body>
</html>
